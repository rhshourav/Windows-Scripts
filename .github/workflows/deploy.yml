name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - 'windowsScripts.ps1'
      - '/**'
  workflow_dispatch:
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Stage deploy folder
        run: |
          mkdir -p page
          cp windowsScripts.ps1 page/
          echo "/ /windowsScripts.ps1 200" > page/_redirects

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Create Pages project (if not exists)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages project create itrun --production-branch main

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy page --project-name=itrun --branch=main --commit-dirty=true

      - name: Print live URL
        run: |
          echo ""
          echo "🚀 Deployed successfully!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Live URL : https://itrun.pages.dev"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
